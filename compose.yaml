services:
  servicio-b:
    build: ./servicio-b
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-a:
    build: ./servicio-a
    ports: ["8080:8080"]
    environment:
      SERVICIO_B_URL: "http://servicio-b:8080/dato"
    depends_on:
      servicio-b:
        condition: service_healthy