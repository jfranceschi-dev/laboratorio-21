name: CI-Arkalitos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        servicio: [servicio-a, servicio-b]

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml

      - name: Compilar y probar cada servicio
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}

      - name: Preparar nombre de imagen
        env:
          SERVICIO: ${{ matrix.servicio }}
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$REPO_NAME/$SERVICIO:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Construir imagen
        working-directory: ${{ matrix.servicio }}
        run: docker build -t "$IMAGE" .

      - name: Login al registro
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        if: github.event_name == 'push'
        run: docker push "$IMAGE"
